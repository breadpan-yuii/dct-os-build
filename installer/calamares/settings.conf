---
# Minimal Calamares sequence for DCT OS.
# Install to /etc/calamares/settings.conf
#
# `branding: dct` is the line that activates installer/branding/dct/.
# Module names drift between Calamares versions — check `ls /usr/lib/*/calamares/modules`
# on the target release before trusting this list.

modules-search: [ /usr/lib/calamares/modules ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services
      - packages
      - removeuser
      - initramfs
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: dct
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
