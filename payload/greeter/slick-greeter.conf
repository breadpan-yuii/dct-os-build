# Dominican OS — LightDM / slick-greeter policy.
# Installed to /etc/lightdm/slick-greeter.conf
#
# slick-greeter reads the x.dm.slick-greeter GSettings schema first, then calls
# UGSettings.apply_conf_settings(), which loads this file and *writes* the keys
# below into the greeter user's dconf on every start. Keys absent from this file
# are reset to the schema value. So: this file is the greeter's real policy, and
# /usr/share/glib-2.0/schemas/99_dct-os.gschema.override is the fallback that
# applies before the greeter runs (and on machines where lightdm-settings has
# not touched anything). Keep the two in sync.
#
# Colours: DCT purple + gray. Background is generated by
# scripts/make-demo-assets.sh from payload/branding/tokens.env.
[Greeter]
background=/usr/share/backgrounds/dct/dct-greeter.png
background-color=#2E2E2E
draw-user-backgrounds=false
draw-grid=false
show-hostname=false
logo=/usr/share/pixmaps/dct-logo.png
theme-name=Yaru-purple-dark
icon-theme-name=Yaru-purple-dark
cursor-theme-name=Yaru
cursor-theme-size=24
font-name=Inter 11
